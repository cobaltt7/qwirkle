name: Lint
on:
    push:
    pull_request:
    workflow_dispatch:

permissions: {}

concurrency:
    group: ${{github.workflow}}-${{github.event.pull_request.number||github.ref}}
    cancel-in-progress: true

jobs:
    format:
        name: Format
        runs-on: ubuntu-26.04
        permissions:
            contents: write # Needed to push
            actions: write # Allow formatting actions too

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  token: ${{secrets.TOKEN||github.token}}
                  persist-credentials: true

            - name: Setup Node.JS
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: package.json

            - name: Install
              run: npm ci

            - name: Format
              run: npm run format

            - name: Assert clean
              if: startsWith(github.ref_name, 'dependabot/') == true
              run: if [[ `git status --porcelain` ]]; then exit 1; fi

            - name: Commit
              uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
              with:
                  commit_message: Format

    analyze:
        name: Analyze
        runs-on: ubuntu-26.04
        permissions:
            security-events: write # Used by github/codeql-action

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup CodeQL
              uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
              with:
                  languages: javascript
                  queries: security-and-quality

            - name: Analyze
              uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5

    build:
        name: Build
        runs-on: ubuntu-26.04

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node.JS
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: package.json

            - name: Install
              run: npm ci

            - name: Typecheck
              run: npm run types

            - name: Build
              run: npm run build

    test:
        name: Test
        runs-on: ubuntu-26.04

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node.JS
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: package.json

            - name: Install
              run: npm ci

            - name: Test
              run: npm run test
